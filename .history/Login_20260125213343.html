<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Login - Blood Bank Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.2);
            max-width: 450px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #e53935 0%, #c62828 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .form-container {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="email"],
        input[type="tel"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #e53935;
        }

        .login-type {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 2px solid #e0e0e0;
        }

        .login-type label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 0;
            font-weight: 500;
            cursor: pointer;
            flex: 1;
        }

        .login-type input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .form-group.email-group {
            display: block;
        }

        .form-group.phone-group {
            display: none;
        }

        .form-group input.error {
            border-color: #c62828;
        }

        .error-message {
            color: #c62828;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .forgot-password {
            text-align: right;
            margin-bottom: 25px;
        }

        .forgot-password a {
            color: #e53935;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #e53935 0%, #c62828 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(229, 57, 53, 0.3);
        }

        .login-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .signup-link a {
            color: #e53935;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            font-size: 13px;
            color: #1565c0;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #e53935;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            position: absolute;
            right: 12px;
            top: 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .form-group {
            position: relative;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🩸 Login</h1>
            <p>Access your donor account</p>
        </div>

        <div class="form-container">
            <div class="alert" id="alertBox"></div>

            <div class="info-box">
                ℹ️ Log in with your email or phone number and password to access your donor account.
            </div>

            <form id="loginForm">
                <div class="login-type">
                    <label>
                        <input type="radio" name="loginType" value="email" checked onchange="toggleLoginType()">
                        Email
                    </label>
                    <label>
                        <input type="radio" name="loginType" value="phone" onchange="toggleLoginType()">
                        Phone
                    </label>
                </div>

                <div class="form-group email-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    <div class="error-message" id="emailError">Please enter a valid email address</div>
                </div>

                <div class="form-group phone-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" pattern="[0-9+\-\s()]+">
                    <div class="error-message" id="phoneError">Please enter a valid phone number</div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    <div class="error-message" id="passwordError">Please enter your password</div>
                </div>

                <div class="forgot-password">
                    <a href="#" onclick="handleForgotPassword(event)">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">Login to Dashboard</button>
            </form>

            <div class="signup-link">
                Don't have an account? <a href="Donation.html">Register as a Donor</a>
            </div>
        </div>
    </div>

    <script>
        function toggleLoginType() {
            const loginType = document.querySelector('input[name="loginType"]:checked').value;
            
            if (loginType === 'email') {
                document.querySelector('.email-group').style.display = 'block';
                document.querySelector('.phone-group').style.display = 'none';
                document.getElementById('email').required = true;
                document.getElementById('phone').required = false;
            } else {
                document.querySelector('.email-group').style.display = 'none';
                document.querySelector('.phone-group').style.display = 'block';
                document.getElementById('email').required = false;
                document.getElementById('phone').required = true;
            }
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = message;
            alertBox.className = `alert show ${type}`;
            setTimeout(() => {
                alertBox.classList.remove('show');
            }, 4000);
        }

        function handleForgotPassword(e) {
            e.preventDefault();
            showAlert('Password reset link has been sent to your email.', 'success');
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const loginType = document.querySelector('input[name="loginType"]:checked').value;
            const password = document.getElementById('password').value;
            let loginIdentifier = '';

            if (loginType === 'email') {
                loginIdentifier = document.getElementById('email').value;
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(loginIdentifier)) {
                    document.getElementById('emailError').classList.add('show');
                    showAlert('Please enter a valid email address.', 'error');
                    return;
                }
            } else {
                loginIdentifier = document.getElementById('phone').value;
                if (loginIdentifier.length < 10) {
                    document.getElementById('phoneError').classList.add('show');
                    showAlert('Please enter a valid phone number.', 'error');
                    return;
                }
            }

            if (password.length === 0) {
                document.getElementById('passwordError').classList.add('show');
                showAlert('Please enter your password.', 'error');
                return;
            }

            // Check if donor exists in localStorage
            const donorData = localStorage.getItem('donorData');
            if (!donorData) {
                showAlert('No donor account found. Please register first.', 'error');
                return;
            }

            const donor = JSON.parse(donorData);
            const isEmailMatch = loginType === 'email' && donor.personalInfo.email === loginIdentifier;
            const isPhoneMatch = loginType === 'phone' && donor.personalInfo.phone === loginIdentifier;
            const isPasswordMatch = donor.password === password;

            if ((isEmailMatch || isPhoneMatch) && isPasswordMatch) {
                // Store logged-in donor info
                localStorage.setItem('loggedInDonor', JSON.stringify(donor));
                showAlert('Login successful! Redirecting to dashboard...', 'success');
                
                setTimeout(() => {
                    window.location.href = 'DonorDashboard.html';
                }, 1500);
            } else {
                showAlert('Invalid credentials. Please try again.', 'error');
            }
        });

        // Clear error messages when user types
        document.getElementById('email').addEventListener('input', function() {
            document.getElementById('emailError').classList.remove('show');
        });

        document.getElementById('phone').addEventListener('input', function() {
            document.getElementById('phoneError').classList.remove('show');
        });

        document.getElementById('password').addEventListener('input', function() {
            document.getElementById('passwordError').classList.remove('show');
        });
    </script>
</body>
</html>
